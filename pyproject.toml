[project]
name = "vexoulz-auth"
version = "0.2.0"
description = "One Twitch sign-in for every vexoulz site, and the per-user data behind it (watch progress)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.20.0",
  "pydantic-settings>=2.4",
  "httpx>=0.28.1",
  "cryptography>=43",
  "structlog>=26.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1.4.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
vexoulz-auth = "vexoulz_auth.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vexoulz_auth"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.uv]
required-version = ">=0.5"

[tool.ruff]
extend = ".conventions/ruff.toml"

[tool.mypy]
files = ["src", "tests"]
python_version = "3.13"
strict = true
ignore_missing_imports = true
